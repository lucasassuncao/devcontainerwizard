name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Repository hygiene, which is platform-independent and only worth doing once:
  # formatting, generated docs, and dependency tidiness. The git-diff comparisons
  # these rely on would only produce line-ending noise on Windows.
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # The Makefile builds its tools into .gobin; without this every job
      # rebuilds them from source. Keyed on tools.mk, where they are pinned, so
      # a version bump misses the cache instead of running the old tool.
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: .gobin
          key: gobin-${{ runner.os }}-${{ hashFiles('scripts/make/tools.mk') }}

      - name: Check dependencies
        run: |
          go mod tidy
          if ! git diff --exit-code; then
            echo ""
            echo "❌ go.mod or go.sum is out of date. Run 'go mod tidy' locally and commit the result."
            exit 1
          fi
          echo "✅ Dependencies are up to date."

      - name: Check formatting
        run: |
          make fmt
          if ! git diff --exit-code; then
            echo ""
            echo "❌ Code is not formatted. Run 'make fmt' locally and commit the result."
            exit 1
          fi
          echo "✅ Code is properly formatted."

      - name: Check docs
        run: |
          make docs
          if ! git diff --exit-code; then
            echo ""
            echo "❌ Documentation is out of date. Run 'make docs' locally and commit the result."
            exit 1
          fi
          echo "✅ Documentation is up to date."

  # devcontainerwizard writes files the IDE then reads, and the rules for doing
  # that differ per platform: path semantics, permission bits, and line endings
  # in the generated devcontainer.json.
  #
  # Lint and security run here, inside the matrix, rather than once on Linux.
  # Go only compiles the files that match the target platform, so a Linux-only
  # analysis never sees code guarded by build tags, which is exactly where
  # platform bugs hide.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: .gobin
          key: gobin-${{ runner.os }}-${{ hashFiles('scripts/make/tools.mk') }}

      - name: Lint
        run: make lint

      - name: Security
        run: make security

      - name: Test
        run: make test-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          if-no-files-found: warn

  # The SBOM and the vulnerability scan describe the dependency graph, which
  # comes from go.mod and is the same everywhere, so this stays out of the OS
  # matrix.
  #
  # It is also its own job rather than a step inside Checks, because it fails
  # differently. A red mark here usually means a CVE was published against a
  # dependency, not that the commit broke something: the job can go red with
  # nothing in the repo having changed.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # syft and grype are slow to build for a scan that takes seconds.
      - name: Cache pinned tools
        uses: actions/cache@v6
        with:
          path: .gobin
          key: gobin-${{ runner.os }}-${{ hashFiles('scripts/make/tools.mk') }}

      # govulncheck is the gate that matters for a Go binary: it only reports
      # advisories reachable from this module's code. It runs before the SBOM
      # scan so its answer is in the log even when grype fails the job on an
      # advisory nothing here can execute.
      - name: Check reachable vulnerabilities
        run: make govulncheck

      - name: Scan dependencies
        run: make vuln

      # Uploaded even when the scan fails: the SBOM is written before grype
      # runs, and it is what you need to triage the findings.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn

  # The site: a static landing page and a docsify app that renders the same
  # markdown this repository already carries in docs/. Nothing is generated at
  # build time, so this job only assembles the directory and uploads it.
  #
  # It waits for Checks rather than the matrix: the site is documentation, and
  # holding a docs fix behind three operating systems buys nothing.
  pages:
    name: Deploy GitHub Pages
    needs: checks
    # Never on a pull request: a deployment from an unmerged branch would
    # overwrite the live site with it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # Job-level permissions replace the default for this job alone, so the
    # token every other job runs with is untouched. contents:read is what
    # checkout needs; the rest is what the Pages deployment needs.
    permissions:
      contents: read
      pages: write
      id-token: write

    # Two deployments must never overlap, and cancelling one mid-publish can
    # leave the site half-updated, so queue rather than cancel.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # docs/pages/ is the site root, so the markdown is copied into it: docsify
      # reads it from there at runtime, while the repository keeps one copy of
      # each page in docs/ where GitHub renders it. The generated reference
      # lives in docs/devcontainerwizard/ and travels with it.
      - name: Prepare site content
        run: |
          cp docs/_sidebar.md docs/pages/
          find docs -maxdepth 1 -name '*.md' -exec cp {} docs/pages/ \;
          cp -r docs/devcontainerwizard docs/pages/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
