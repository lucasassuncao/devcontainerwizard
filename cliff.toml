# The release notes `make tag` writes into each tag's annotation: every commit
# since the previous tag, grouped by type, subject and body.
# https://git-cliff.org/docs/configuration

[changelog]
# "Release vX" becomes the tag's subject, the groups below it its body.
body = """
Release {{ version }}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group }}
{% for commit in entry.commits %}
{%- set rest = commit.raw_message | trim | split(pat="\n") | slice(start=1) | join(sep="\n") | trim %}
* {% if commit.breaking %}**BREAKING** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first }} ({{ commit.id | truncate(length=7, end="") }})
{% if rest %}
{{ rest | indent(prefix="  ", first=true) }}
{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
# The template leaves two blank lines between groups; keep one.
postprocessors = [{ pattern = '\n{3,}', replace = "\n\n" }]

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
commit_parsers = [
    { message = '^Merge ', skip = true },
    { message = '^feat[(!:]', group = "Features" },
    { message = '^fix[(!:]', group = "Bug Fixes" },
    { message = '^perf[(!:]', group = "Performance" },
    { message = '^refactor[(!:]', group = "Refactoring" },
    { message = '^docs?[(!:]', group = "Documentation" },
    { message = '^test[(!:]', group = "Tests" },
    { message = '^build[(!:]', group = "Build" },
    { message = '^ci[(!:]', group = "CI" },
    { message = '^style[(!:]', group = "Style" },
    { message = '^revert[(!:]', group = "Reverts" },
    { message = '^chore[(!:]', group = "Chores" },
    { message = '.*', group = "Other" },
]
tag_pattern = 'v[0-9].*'
sort_commits = "newest"
